name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS patcher syntax
        run: node --check patcher/patch_asar.mjs

      - name: Check shell scripts syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh uninstall.sh

      - name: Build and test Rust bridge & router
        shell: bash
        run: |
          rustc --edition 2021 -O -C debuginfo=0 -D warnings src/bridge.rs -o bridge_bin
          rustc --edition 2021 --test -D warnings src/bridge.rs -o bridge_test
          ./bridge_test
          rustc --edition 2021 -O -C debuginfo=0 -D warnings src/router.rs -o router_bin
          rustc --edition 2021 --test -D warnings src/router.rs -o router_test
          ./router_test